name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:           
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   
          ref: main        
      - uses: astral-sh/setup-uv@v2
      - run: uv sync
      - name: Run semantic-release
        run: uv run semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
